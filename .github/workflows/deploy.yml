name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          # Scoped deploy user — rrsync chdirs us to /var/www/apps/shepherdly,
          # the key is command-restricted to this one dir and three verbs
          # (rsync / migrate / restart). .env.production is kept on the server
          # (never shipped from CI) so --exclude it from --delete.
          rsync -avzO --no-perms --no-times --mkpath --delete \
            --exclude='*.db' --exclude='*.db-wal' --exclude='*.db-shm' \
            --exclude='.env.production' \
            -e "ssh -i ~/.ssh/deploy_key" \
            .next/standalone/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:

          rsync -avzO --no-perms --no-times --mkpath \
            -e "ssh -i ~/.ssh/deploy_key" \
            .next/static/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:.next/static/

          if [ -d "public" ]; then
            rsync -avzO --no-perms --no-times --mkpath \
              -e "ssh -i ~/.ssh/deploy_key" \
              public/ \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:public/
          fi

          # Schema files + maintenance scripts (traced out of the standalone
          # build; shipped separately).
          rsync -avzO --no-perms --no-times --mkpath \
            -e "ssh -i ~/.ssh/deploy_key" \
            db/migrations/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:db/migrations/

          rsync -avzO --no-perms --no-times --mkpath \
            -e "ssh -i ~/.ssh/deploy_key" \
            scripts/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:scripts/

          # Apply pending SQL migrations (idempotent on the server) + pm2 restart.
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} migrate
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} restart
