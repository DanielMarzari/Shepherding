name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Ship the runtime env file
        # This repo's ENCRYPTION_KEY secret is the only surviving copy of the
        # key: it is not in the pm2 ecosystem config and cannot be recovered
        # from the database. Without it every decrypt silently returns null
        # and the app renders "(unknown #id)" for every person, so write the
        # file on every deploy and run this step first — if it fails, nothing
        # has been shipped and the running app is untouched.
        run: |
          if [ -z "${{ secrets.ENCRYPTION_KEY }}" ]; then
            echo "::error::ENCRYPTION_KEY secret is empty — refusing to deploy an app that cannot read its own data."
            exit 1
          fi
          umask 077
          printf 'ENCRYPTION_KEY=%s\nOSRM_URL=http://localhost:5000\n' '${{ secrets.ENCRYPTION_KEY }}' > env.production.staged
          # F660, not F600. /var/www/apps/shepherdly carries a default ACL
          # granting user:ubuntu (which pm2 runs the app as) while the files
          # are owned by the deploy user. On a file with an extended ACL the
          # group bits ARE the ACL mask, so 600 masks that grant down to
          # #effective:--- and the app cannot read its own key — the same
          # outage as having no file at all. 660 leaves the mask at rw- and
          # still denies everyone else.
          rsync -avzO --no-times --chmod=F660 \
            -e "ssh -i ~/.ssh/deploy_key" \
            env.production.staged \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:.env.production
          rm -f env.production.staged

      - name: Deploy
        run: |
          # Scoped deploy user — rrsync chdirs us to /var/www/apps/shepherdly,
          # the key is command-restricted to this one dir and three verbs
          # (rsync / migrate / restart). .env.production is written by the step
          # above and must survive --delete, so keep it excluded.
          rsync -avzO --no-perms --no-times --mkpath --delete \
            --exclude='*.db' --exclude='*.db-wal' --exclude='*.db-shm' \
            --exclude='.env.production' \
            -e "ssh -i ~/.ssh/deploy_key" \
            .next/standalone/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:

          rsync -avzO --no-perms --no-times --mkpath \
            -e "ssh -i ~/.ssh/deploy_key" \
            .next/static/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:.next/static/

          if [ -d "public" ]; then
            rsync -avzO --no-perms --no-times --mkpath \
              -e "ssh -i ~/.ssh/deploy_key" \
              public/ \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:public/
          fi

          # Schema files + maintenance scripts (traced out of the standalone
          # build; shipped separately).
          rsync -avzO --no-perms --no-times --mkpath \
            -e "ssh -i ~/.ssh/deploy_key" \
            db/migrations/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:db/migrations/

          rsync -avzO --no-perms --no-times --mkpath \
            -e "ssh -i ~/.ssh/deploy_key" \
            scripts/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:scripts/

          # Apply pending SQL migrations (idempotent on the server) + pm2 restart.
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} migrate
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} restart
